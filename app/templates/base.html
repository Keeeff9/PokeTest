<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Pokedex{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-danger mb-4">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('pokemon.index') }}">Pokedex</a>
      <form class="d-flex" action="{{ url_for('pokemon.search') }}" method="get">
        <input class="form-control me-2" type="search" name="q"
               placeholder="Nombre o numero" aria-label="Buscar">
        <button class="btn btn-light" type="submit">Buscar</button>
      </form>
    </div>
  </nav>

  <main class="container pb-5">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
